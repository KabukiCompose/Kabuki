version: 2

updates:
  # Actions are pinned by full SHA here, and Dependabot understands that: it
  # bumps the SHA and rewrites the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Composite actions live outside the workflows directory, and the entry above
  # does not reach them - it covers .github/workflows and a root action.yml only.
  # Without this the action pinned inside ours would never be bumped.
  - package-ecosystem: github-actions
    directory: /.github/actions/instrumented-tests
    schedule:
      interval: monthly
    groups:
      composite-actions:
        patterns: ["*"]

  # The version catalog, split in two on purpose. The toolchain moves as one
  # piece - compiler, Compose plugin and AGP are a single decision and a single
  # review. Everything else is independent, and putting it in the same pull
  # request makes a two-line library bump wait for an AGP major.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      toolchain:
        patterns:
          # Kotlin artifacts and Kotlin plugin markers, but NOT kotlinx: the
          # coroutines live under org.jetbrains.kotlinx and are an ordinary
          # library that has no business waiting for a compiler bump.
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.compose*"
          - "com.android*"
          # Dependabot calls the Gradle distribution this. A Gradle major is a
          # migration like the rest of this group, not a version bump.
          - "gradle-wrapper"
      libraries:
        patterns: ["*"]
    ignore:
      # For a LIBRARY, AGP 9 is not a version bump: it refuses our plugin layout,
      # and it makes our compileSdk a floor for consumers. Staying on AGP 8 is the
      # same decision as metadata 2.2 and Java 11 bytecode - build with the old
      # thing so that many can read us. Gradle 9 comes along for the ride.
      - dependency-name: "com.android*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # Compose 1.12 is a MINOR that demands AGP 9.1, so it cannot land before that
      # migration - and it would hold every Kotlin update in the same red PR.
      # Lift together with the AGP entries above.
      - dependency-name: "org.jetbrains.compose*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # consumer-check is NOT listed here, and that is the point: there is nothing in
  # it to update. Its Kotlin is pinned to the oldest version we support - raising
  # it deletes the check instead of maintaining it - and Kabuki itself comes from
  # mavenLocal, published by the job right before. An ignore list was tried and
  # missed: Dependabot names that plugin `jvm`, not by its marker coordinates.
  # Security alerts do not depend on this file, so nothing is lost.
